spring.application.name=piopiofly

# Variables locales y secretos (ver .env.example); nunca se suben a git
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/piopiofly}
spring.datasource.username=${DATABASE_USERNAME:piopiofly}
spring.datasource.password=${DATABASE_PASSWORD:piopiofly}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

# Club al que sigue la app (identificador en laliga.com)
piopiofly.club-slug=ud-las-palmas

# Calendario de partidos
piopiofly.fixtures.laliga-url=https://www.laliga.com/en-GB/clubs/ud-las-palmas/next-matches
piopiofly.fixtures.timeout=20s
piopiofly.fixtures.sync-cron=0 0 */6 * * *
piopiofly.fixtures.sync-on-startup=true
